name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# CVE-2026-114938 (Java4Shell): temporary workaround for unpatched Java 21 JVMs.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Base64 intrinsic is disabled
        shell: bash
        run: |
          set -euo pipefail
          java -XX:+PrintFlagsFinal -version 2>&1 | grep -E 'UseBASE64Intrinsics[[:space:]]+=[[:space:]]+false'
      - run: mvn --batch-mode --update-snapshots verify
